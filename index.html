<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vorratstracker - Barcode Scanner</title>
  
  <!-- ZXing für Barcode-Scanning per Kamera -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  
  <!-- Firebase SDKs (Compatibility Build für einfaches HTML/JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
    h1, h2 { text-align: center; color: #4da6ff; margin-bottom: 10px; }
    
    .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #video-container { width: 100%; max-width: 400px; margin: 0 auto; overflow: hidden; border-radius: 8px; position: relative; background: #000; }
    video { width: 100%; display: block; }
    
    button { background: #0066cc; color: white; border: none; padding: 12px 16px; font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    button:active { background: #004999; }
    
    #status { text-align: center; font-weight: bold; margin-top: 10px; color: #ffcc00; min-height: 24px; }
    
    /* Bestands-Liste */
    .inventory-list { list-style: none; padding: 0; margin: 0; }
    .inventory-item { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; }
    .item-info { display: flex; align-items: center; gap: 12px; }
    .item-info img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #333; }
    .quantity-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty { width: 34px; height: 34px; padding: 0; font-size: 1.2rem; border-radius: 50%; background: #3c3c3c; margin-top: 0; }
  </style>
</head>
<body>

  <h1>🍎 Vorratstracker</h1>

  <!-- 1. KAMERA & SCANNER -->
  <div class="card">
    <h2>Barcode scannen</h2>
    <div id="video-container">
      <video id="video"></video>
    </div>
    <div id="status">Kamera bereit...</div>
    <button id="toggle-cam">Kamera An/Aus</button>
  </div>

  <!-- 2. BESTANDS-VISUALISIERUNG -->
  <div class="card">
    <h2>Mein Bestand</h2>
    <ul id="inventory" class="inventory-list">
      <li style="text-align: center; color: #888;">Lade Bestand...</li>
    </ul>
  </div>

  <script>
    // --- 1. FIREBASE KONFIGURATION ---
    // Ersetze dieses Objekt mit deinen Daten aus der Firebase Console!
    const firebaseConfig = {
        apiKey: "AIzaSyA12PWWueSDSRMxl9b7Pvoa1Vm0-UTAhlI",
        authDomain: "bestand-55f09.firebaseapp.com",
        projectId: "bestand-55f09",
        storageBucket: "bestand-55f09.firebasestorage.app",
        messagingSenderId: "632559442316",
        appId: "1:632559442316:web:fb0bc9422e70633a995ea9",
        measurementId: "G-LP15L1CQHL"
    };

    // Firebase initialisieren
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- 2. SCANNER LOGIK ---
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let isScanning = false;
    let isProcessing = false;

    const statusElem = document.getElementById('status');

    async function startScanner() {
      try {
        isScanning = true;
        statusElem.innerText = "Kamera sucht nach Barcode...";
        
        await codeReader.decodeFromVideoDevice(null, 'video', async (result, err) => {
          if (result && !isProcessing) {
            isProcessing = true;
            const ean = result.text;
            statusElem.innerText = `Gescannt: ${ean}. Suche Produkt...`;

            await processBarcode(ean);

            // 3 Sekunden Pause vor dem nächsten Scan
            setTimeout(() => { 
              isProcessing = false; 
              if (isScanning) statusElem.innerText = "Bereit für nächsten Scan"; 
            }, 3000);
          }
        });
      } catch (err) {
        statusElem.innerText = "Fehler beim Starten der Kamera.";
        console.error(err);
      }
    }

    function stopScanner() {
      codeReader.reset();
      isScanning = false;
      statusElem.innerText = "Kamera gestoppt.";
    }

    document.getElementById('toggle-cam').addEventListener('click', () => {
      if (isScanning) stopScanner();
      else startScanner();
    });

    // --- 3. OPEN FOOD FACTS & FIREBASE INTEGRATION ---
    async function processBarcode(ean) {
      try {
        const docRef = db.collection("inventory").doc(ean);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
          // Produkt existiert -> Anzahl um 1 erhöhen
          const currentQty = docSnap.data().quantity || 0;
          await docRef.update({ quantity: currentQty + 1 });
          statusElem.innerText = `+1 ${docSnap.data().name} hinzugefügt!`;
        } else {
          // Produkt existiert nicht -> Bei Open Food Facts abfragen
          const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${ean}.json`);
          const offerData = await response.json();

          let productName = "Unbekanntes Produkt";
          let imageUrl = "https://via.placeholder.com/100?text=Kein+Bild";

          if (offerData.status === 1) {
            productName = offerData.product.product_name || offerData.product.brands || "Produkt ohne Name";
            imageUrl = offerData.product.image_front_small_url || imageUrl;
          }

          // Neues Produkt in Firebase anlegen
          await docRef.set({
            ean: ean,
            name: productName,
            quantity: 1,
            image_url: imageUrl,
            created_at: firebase.firestore.FieldValue.serverTimestamp()
          });

          statusElem.innerText = `Neu hinzugefügt: ${productName}`;
        }

      } catch (err) {
        console.error("Fehler bei der Verarbeitung:", err);
        statusElem.innerText = "Fehler beim Verarbeiten des Barcodes.";
      }
    }

    // --- 4. BESTAND IN ECHTZEIT VISUALISIEREN ---
    // onSnapshot sorgt dafür, dass sich die Seite auf allen Handys automatisch aktualisiert!
    db.collection("inventory").orderBy("name").onSnapshot((snapshot) => {
      const listElem = document.getElementById('inventory');
      listElem.innerHTML = "";

      if (snapshot.empty) {
        listElem.innerHTML = "<li style='text-align: center; color: #888;'>Keine Produkte im Bestand.</li>";
        return;
      }

      snapshot.forEach((doc) => {
        const item = doc.data();
        const li = document.createElement('li');
        li.className = 'inventory-item';
        li.innerHTML = `
          <div class="item-info">
            <img src="${item.image_url}" alt="${item.name}">
            <div>
              <strong>${item.name}</strong><br>
              <small style="color: #aaa;">EAN: ${item.ean}</small>
            </div>
          </div>
          <div class="quantity-controls">
            <button class="btn-qty" onclick="updateQuantity('${item.ean}', ${item.quantity - 1})">-</button>
            <span style="font-weight: bold; min-width: 20px; text-align: center;">${item.quantity}</span>
            <button class="btn-qty" onclick="updateQuantity('${item.ean}', ${item.quantity + 1})">+</button>
          </div>
        `;
        listElem.appendChild(li);
      });
    }, (error) => {
      console.error("Fehler beim Laden des Bestands:", error);
      document.getElementById('inventory').innerHTML = "<li style='color: red; text-align: center;'>Fehler beim Laden der Daten.</li>";
    });

    async function updateQuantity(ean, newQuantity) {
      const docRef = db.collection("inventory").doc(ean);
      if (newQuantity <= 0) {
        await docRef.delete();
      } else {
        await docRef.update({ quantity: newQuantity });
      }
    }
  </script>
</body>
</html>
